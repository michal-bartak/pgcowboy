# pgCowboy example config — copy structure only; app creates its own file on first launch.
#
# Clusters, cluster groups and the target selection live in clusters.yaml beside this file —
# see clusters.example.yaml.
#
# db_functions.<operation>.call — template body
# db_functions.<operation>.execution — function | statement | block (default: function)
# See sql/README.md
#
# Create role: ARRAY['fixed_group', ...] || ${parent_roles}
#   - empty parent role in UI → SQL "... || NULL"
#   - set parent role → "... || $n::text[]"

version: 1
# Defaults are vanilla PostgreSQL DDL (statement mode), shown below. Override any command
# with a privileged wrapper function (execution: function) or a PL/pgSQL block — e.g. so a
# low-privilege connect user can act through a SECURITY DEFINER function that also writes an
# audit log or sends a notification. Commented variants illustrate the alternatives.
db_functions:
  create_role:
    execution: statement
    call: "CREATE ROLE ${loginname}"
  # create_role:
  #   # Built-ins are single-brace (${loginname}, ${parent_roles}); a comment field is
  #   # DOUBLE-brace, one per comment_fields entry (e.g. ${{full_name}}, ${{e_mail}}) —
  #   # empty/absent comment fields pass as SQL NULL. A comment field cannot appear inside the
  #   # ARRAY['grp'] || ${parent_roles} concat form.
  #   execution: function
  #   call: "admin_access.create_role(${loginname}, NULL, ${{full_name}}, ${{e_mail}}, ARRAY['gr_personal_users'] || ${parent_roles})"
  remove_role:
    execution: statement
    call: "DROP ROLE ${loginname}"
  rename_role:
    # ${loginname} = current name, ${new_loginname} = new name (both identifiers). Runs first in
    # the cluster's transaction, so every op after it addresses the new name.
    execution: statement
    call: "ALTER ROLE ${loginname} RENAME TO ${new_loginname}"
  # remove_role:
  #   execution: function
  #   call: "your_schema.remove_app_role(${loginname})"
  # remove_role:
  #   execution: block   # a complete anonymous block, run verbatim (write your own DO/delimiter)
  #   call: |
  #     DO $do$ BEGIN
  #       DROP ROLE ${loginname};
  #     END $do$;
  grant_parents:
    execution: statement
    call: "GRANT ${parent_roles} TO ${loginname}"
  # grant_parents:
  #   execution: function
  #   call: "your_schema.grant_role_parents(${loginname}, ${parent_roles})"
  revoke_parents:
    execution: statement
    call: "REVOKE ${parent_roles} FROM ${loginname}"
  # revoke_parents:
  #   execution: function
  #   call: "your_schema.revoke_role_parents(${loginname}, ${parent_roles})"
  change_password:
    execution: statement
    call: "ALTER ROLE ${loginname} PASSWORD ${new_password}"
  # change_password:
  #   execution: function
  #   call: "your_schema.change_role_password(${loginname}, ${new_password})"
  set_comment:
    execution: statement
    call: "COMMENT ON ROLE ${loginname} IS ${comment}"
  set_attribute:
    execution: statement
    call: "ALTER ROLE ${loginname} WITH ${attributes}"
  set_config:
    execution: statement
    call: "ALTER ROLE ${loginname} SET ${config_name} = ${config_value}"
  reset_config:
    execution: statement
    call: "ALTER ROLE ${loginname} RESET ${config_name}"

# db_reads: the read/introspection queries used by Alter role. Plain SQL with a single named bind
# ${rolename} (converted to $1 before execution; a legacy $1 also works) — the search pattern for
# search_roles; the role name for role_detail/role_parents/role_dependencies. Result columns are scanned BY NAME
# against a fixed contract (see sql/README.md → Introspection queries): column order is irrelevant,
# NULL comment/rolconfig is fine, an omitted contract column is treated as zero, and an extra
# unmapped column is an error. Defaults are vanilla catalog queries; override a read with a
# privileged wrapper function/view (e.g. SELECT rolname, comment FROM admin.search(${rolename}))
# when the connect user cannot read the catalogs directly. Omit a key to use its default.
db_reads:
  search_roles:
    # Contract columns: rolname (text), comment (text, nullable).
    query: |
      SELECT r.rolname     AS rolname,
             d.description AS comment
      FROM pg_roles              AS r
      LEFT JOIN pg_shdescription AS d
             ON d.objoid   = r.oid
            AND d.classoid = 'pg_authid'::regclass
      WHERE r.rolname     ILIKE ${rolename}
         OR d.description ILIKE ${rolename}
      ORDER BY r.rolname
  role_detail:
    # Contract columns (one row): rolsuper, rolcreaterole, rolcreatedb, rolinherit, rolcanlogin,
    # rolreplication, rolbypassrls (bool), comment (text, nullable), rolconfig (text[], nullable).
    query: |
      SELECT r.rolsuper       AS rolsuper,
             r.rolcreaterole  AS rolcreaterole,
             r.rolcreatedb    AS rolcreatedb,
             r.rolinherit     AS rolinherit,
             r.rolcanlogin    AS rolcanlogin,
             r.rolreplication AS rolreplication,
             r.rolbypassrls   AS rolbypassrls,
             d.description    AS comment,
             r.rolconfig      AS rolconfig
      FROM pg_roles              AS r
      LEFT JOIN pg_shdescription AS d
             ON d.objoid   = r.oid
            AND d.classoid = 'pg_authid'::regclass
      WHERE r.rolname = ${rolename}
  role_parents:
    # Contract columns (one row per parent): rolname (text).
    query: |
      SELECT g.rolname AS rolname
      FROM pg_auth_members AS m
      JOIN pg_roles        AS g ON g.oid = m.roleid
      JOIN pg_roles        AS u ON u.oid = m.member
      WHERE u.rolname = ${rolename}
      ORDER BY g.rolname
  role_dependencies:
    # Pre-flight check run before a role is dropped (Remove role / a pending presence removal):
    # one row per object that depends on the role. A cluster that reports rows is skipped by
    # default in the confirmation popup unless the user picks "Try anyway".
    # Contract columns (one row per dependency): database, dependency, class, object (text).
    # Note: pg_shdepend only describes objects of the database the app connects to, plus
    # cluster-wide ones — rows from other databases are reported but not described.
    query: |
      SELECT COALESCE(d.datname, current_database()) AS database,
             CASE s.deptype
                 WHEN 'o' THEN 'owner'
                 WHEN 'a' THEN 'privileges (ACL)'
                 WHEN 'i' THEN 'initial privileges'
                 WHEN 'r' THEN 'RLS policy'
                 WHEN 't' THEN 'tablespace'
                 WHEN 'p' THEN 'pinned (system)'
             END AS dependency,
             s.classid::regclass::TEXT AS class,
             CASE WHEN s.dbid = 0 OR d.datname = current_database()
                  THEN pg_describe_object(s.classid, s.objid, s.objsubid)
                  ELSE 'Located in other database'
             END AS object
      FROM pg_shdepend      AS s
      JOIN pg_roles         AS r ON r.oid  = s.refobjid
      LEFT JOIN pg_database AS d ON s.dbid = d.oid
      WHERE s.refclassid = 'pg_authid'::regclass
        AND r.rolname    = ${rolename}
      ORDER BY 1, 2, 3, 4
batch:
  max_concurrency: 5

# ui.theme: light | dark | system (follow OS appearance)
# ui.comment_default_view: fields | raw — the mode the comment editor opens in, in the role
#   form and in the Comments dialog alike. A preference, not a rule: a plain-text comment has
#   no fields to show and always opens in raw. Defaults to raw.
# ui.password_gen: role-form random password generator. length is clamped to [6,128] (default
#   10); at least one character class stays enabled (lowercase forced on if all are off).
ui:
  theme: system
  comment_default_view: raw
  password_gen:
    length: 10
    lowercase: true
    uppercase: false
    digits: true
    symbols: false
    exclude_similar: false

# parent_roles: preconfigured role parents offered as pick-list choices when assigning role
# parents (Create role / Alter role). Bare identifiers; several can be assigned at once.
parent_roles:
  - gr_devs_ro
  - gr_reporting
  - gr_admins

# comment_fields: JSON keys surfaced as labeled inputs in the role form when a role's
# COMMENT holds JSON. Ordered; keys not listed here are still shown generically. Keys are
# bare identifiers. Empty by default — which keys a comment carries is a site convention —
# and never refilled on load, so removing every field sticks. Plain-text comments are edited
# via the Raw view regardless of this list.
comment_fields:
  - key: full_name
    label: Full name
  - key: e_mail
    label: Email

# search_columns: extra columns shown next to the role name in the Find-role results (the role
# name itself is always the first column and is not configurable). Ordered. Each template is
# display text supporting exactly two placeholders: ${{<key>}} resolves to that key in the role's
# JSON comment (any key, not just the comment_fields ones), and ${comment} to the whole comment
# verbatim — which is how a comment whose JSON has its own "comment" key stays addressable, and the
# way to show a plain-text comment. Anything else is rejected when saving, including the
# call-template names ${loginname} / ${parent_roles}, which a display column has no use for.
# An unknown key, a JSON null and a non-JSON comment all resolve to empty,
# and the result is whitespace-collapsed, so "${{first_name}} ${{last_name}}" yields "John" when
# there is no last name. Non-string values render typed (42, true, ["a"]).
# Omit the key to get the default single "Comment" column; an explicit empty list
# (search_columns: []) shows the role name only.
search_columns:
  - label: Comment
    template: ${comment}
